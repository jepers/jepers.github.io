<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Skrivstart</title>
  <style>
    :root{
      --bg:#444;
      --fg:#eee;
      --muted:#bbb;
      --panel:#3a3a3a;
      --panel2:#333;
      --good:#6c8;
      --remain:#abc;
      --danger:#f88;
      --btn:#555;
      --btn2:#666;
      --btnText:#fff;
      --focus:#9cf;
      --padX:50px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
      background:var(--bg);
      color:var(--fg);
    }
    a{ color:inherit; }
    .app{
      width:min(1100px, 100%);
      margin:0 auto;
      padding:24px 16px 40px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }
    .card{
      width:100%;
      background:var(--panel);
      border-radius:14px;
      padding:16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .row > *{ flex:0 0 auto; }
    .col{ display:flex; flex-direction:column; gap:8px; }
    label{ font-size:14px; color:var(--muted); }
    input[type="text"], input[type="number"]{
      width: 240px;
      max-width: 100%;
      background:var(--panel2);
      border:1px solid rgba(255,255,255,.12);
      color:var(--fg);
      border-radius:10px;
      padding:10px 12px;
      outline:none;
    }
    input[type="number"]{ width: 140px; }
    input:disabled{
      opacity:.6;
      cursor:not-allowed;
    }
    .help{ font-size:13px; color:var(--muted); }
    .warn{ font-size:13px; color:var(--danger); }
    .ok{ font-size:13px; color:var(--good); }

    button{
      background:var(--btn);
      border:1px solid rgba(255,255,255,.12);
      color:var(--btnText);
      border-radius:12px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:600;
      outline:none;
    }
    button:hover{ background:var(--btn2); }
    button:disabled{
      opacity:.5;
      cursor:not-allowed;
    }
    button.small{
      padding:8px 10px;
      font-weight:600;
      border-radius:10px;
    }
    button:focus, input:focus, textarea:focus{
      box-shadow: 0 0 0 3px rgba(153,204,255,.35);
      border-color: rgba(153,204,255,.55);
    }

    .spinner{
      width:42px; height:42px;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: rgba(255,255,255,.9);
      border-radius:50%;
      animation: spin 1s linear infinite;
      margin: 18px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .centerText{
      width:100%;
      padding: 0 var(--padX);
      text-align:center;
      word-break:break-word;
      white-space:pre-wrap;
      line-height:1.25;
    }

    /* Target and overlay share font size (set inline) */
    .target{
      user-select:none;
    }
    .target .good{ color:var(--good); }
    .target .remain{ color:var(--remain); }

    .inputWrap{
      width:100%;
      padding: 0 var(--padX);
      display:flex;
      justify-content:center;
    }
    .inputBox{
      width:min(920px, 100%);
      position:relative;
    }
    .overlay{
      position:absolute;
      inset:0;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:var(--panel2);
      overflow:auto;
      white-space:pre-wrap;
      word-break:break-word;
      text-align:center;
      line-height:1.25;
      pointer-events:none;
    }
    textarea{
      position:relative;
      width:100%;
      min-height: 140px;
      resize:vertical;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:transparent;
      color:transparent;              /* hide actual text */
      caret-color: var(--fg);         /* show caret */
      outline:none;
      overflow:auto;
      white-space:pre-wrap;
      word-break:break-word;
      text-align:center;
      line-height:1.25;
    }
    .overlay .good{ color:var(--good); }
    .overlay .rest{ color:var(--fg); }

    .statsGrid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:10px;
    }
    @media (max-width:700px){
      .statsGrid{ grid-template-columns: 1fr; }
      :root{ --padX:16px; }
    }
    .stat{
      background: rgba(0,0,0,.12);
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      padding:12px;
    }
    .stat .k{ font-size:12px; color:var(--muted); }
    .stat .v{ font-size:18px; font-weight:800; margin-top:4px; }

    .historyTitle{ font-size:18px; font-weight:900; margin:0 0 8px; }
    .historySummary{
      display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:13px;
      margin-bottom:10px;
    }
    canvas{
      width:100%;
      height:180px;
      background: rgba(0,0,0,.12);
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      display:block;
    }
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
      font-size:13px;
    }
    th, td{
      padding:8px 8px;
      border-bottom:1px solid rgba(255,255,255,.10);
      text-align:left;
      vertical-align:top;
    }
    th{ color:var(--muted); font-weight:700; }
    tr:hover{ background: rgba(255,255,255,.05); }
    tr:focus-within{ outline:2px solid rgba(153,204,255,.45); outline-offset:2px; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .pill{
      display:inline-block;
      padding:2px 8px;
      border-radius:999px;
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.10);
      color:var(--muted);
      font-size:12px;
      margin-left:6px;
    }
    .errorBox{
      color:#fee;
      background: rgba(255,0,0,.08);
      border:1px solid rgba(255,140,140,.35);
      border-radius:14px;
      padding:14px;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- Rendering happens here -->
  </div>

<script>
(() => {
  "use strict";

  // ===== Constants (spec) =====
  const SpecVersion = "1.3";
  const StorageSchemaVersion = 1;

  const DEFAULTS = {
    seedText: "",
    minLen: 10,
    maxLen: 200,
    fontSizePx: 36,
    seedSalt: 0,
    historyLimit: 500,
  };

  const maxDurationMs = 10 * 60 * 1000; // 10 min
  const CPM_CAP = 2000;

  // ===== Model (single source of truth) =====
  const model = {
    state: "loading", // "loading" | "config" | "playing" | "result" | "error"
    sentences: [],
    datasetId: "",
    settings: {
      seedText: DEFAULTS.seedText,
      minLen: DEFAULTS.minLen,
      maxLen: DEFAULTS.maxLen,
      fontSizePx: DEFAULTS.fontSizePx,
      seedSalt: DEFAULTS.seedSalt,
      historyLimit: DEFAULTS.historyLimit,
    },
    ui: {
      warnings: [],
      candidateCount: 0,
      seedNorm: "",
      canStart: false,
      datasetLoaded: false,
      overlayOk: true,
    },
    session: null,  // { seedText, seedNorm, seedBase, seriesIndex }
    run: null,      // current/last run
    history: null,  // loaded from localStorage
    error: null,
  };

  // ===== Settings metadata (data-driven) =====
  const settingsMeta = [
    { id: "seedText", label: "Kod", type: "text", ui: true, hint: "Dela koden med andra för samma mening/serie." },
    { id: "minLen", label: "Min längd", type: "number", ui: true, min: 0, step: 1 },
    { id: "maxLen", label: "Max längd", type: "number", ui: true, min: 0, step: 1 },
    { id: "fontSizePx", label: "Textstorlek (px)", type: "number", ui: true, min: 12, step: 1 },
    { id: "seedSalt", label: "seedSalt", type: "number", ui: false, min: 0, step: 1 },
    { id: "historyLimit", label: "Historikgräns", type: "number", ui: false, min: 0, step: 1 },
  ];

  // ===== DOM handles (created once for settings controls) =====
  const appEl = document.getElementById("app");
  const controls = new Map(); // settingId -> input element
  const warningEls = new Map(); // id -> warning span (optional)

  // Gameplay DOM references (rebuilt per state render; no hidden truth)
  let textareaEl = null;
  let overlayEl = null;
  let nextBtnEl = null;

  // Result enter-capture (active only in result)
  let resultKeyHandler = null;

  // ===== Utils =====
  const clampInt = (n, lo, hi) => {
    n = (Number.isFinite(n) ? Math.trunc(n) : lo);
    if (hi !== undefined) n = Math.min(n, hi);
    return Math.max(lo, n);
  };

  const pad2 = (n) => String(n).padStart(2, "0");
  const pad3 = (n) => String(n).padStart(3, "0");

  function formatDurationMs(ms) {
    ms = Math.max(0, Math.trunc(ms));
    const m = Math.trunc(ms / 60000);
    const s = Math.trunc((ms % 60000) / 1000);
    const r = ms % 1000;
    return `${pad2(m)}:${pad2(s)}.${pad3(r)}`;
  }

  function visualizeSpaces(s) {
    // display-only: SPACE -> ·
    return s.replace(/ /g, "·");
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => (
      c === "&" ? "&amp;" :
      c === "<" ? "&lt;" :
      c === ">" ? "&gt;" :
      c === '"' ? "&quot;" : "&#39;"
    ));
  }

  // ===== Determinism: UTF-8 bytes + FNV-1a 32-bit =====
  function utf8Bytes(str) {
    // TextEncoder is deterministic for UTF-8
    return new TextEncoder().encode(str);
  }

  function hash32_FNV1a_UTF8(str) {
    const data = utf8Bytes(str);
    let h = 0x811c9dc5 >>> 0;
    for (let i = 0; i < data.length; i++) {
      h ^= data[i];
      // h *= 16777619 with 32-bit overflow
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h >>> 0;
  }

  function hex8(u32) {
    return (u32 >>> 0).toString(16).padStart(8, "0");
  }

  // ===== PRNG: xorshift32 (exact) =====
  function xorshift32(seedU32) {
    let x = seedU32 >>> 0;
    x ^= (x << 13) >>> 0;
    x ^= (x >>> 17) >>> 0;
    x ^= (x << 5) >>> 0;
    return x >>> 0;
  }

  // ===== Deterministic selection: Strategy B (Indexed reseed) =====
  function computeCandidates(sentences, minLen, maxLen) {
    // JS string.length = UTF-16 code units (spec)
    return sentences.filter(s => (minLen <= s.length && s.length <= maxLen));
  }

  function computeSeedMaterialBase(datasetId, minLen, maxLen, seedSalt, seedNorm) {
    return datasetId + "|" +
      String(minLen) + "|" +
      String(maxLen) + "|" +
      String(seedSalt) + "|" +
      seedNorm;
  }

  function computeSeedBase(datasetId, minLen, maxLen, seedSalt, seedNorm) {
    const base = computeSeedMaterialBase(datasetId, minLen, maxLen, seedSalt, seedNorm);
    return hash32_FNV1a_UTF8(base) >>> 0;
  }

  function selectTarget(sentences, datasetId, settings, seriesIndex) {
    const seedNorm = settings.seedText.trim(); // deterministisk seed normalisering
    const minLen = settings.minLen;
    const maxLen = settings.maxLen;
    const seedSalt = settings.seedSalt;

    const candidates = computeCandidates(sentences, minLen, maxLen);
    if (candidates.length === 0) return { target: null, candidatesCount: 0, seedNorm, seedBase: 0 };

    const seedBase = computeSeedBase(datasetId, minLen, maxLen, seedSalt, seedNorm);
    const seedI = hash32_FNV1a_UTF8(hex8(seedBase) + "|" + String(seriesIndex)) >>> 0;
    const x = xorshift32(seedI);
    const idx = x % candidates.length;
    return { target: candidates[idx], candidatesCount: candidates.length, seedNorm, seedBase };
  }

  // ===== Parsing + datasetId (exact) =====
  function parseSentencesExact(text) {
    text = text.replace(/\r\n/g, "\n");
    text = text.trimEnd();
    const rawLines = text.split("\n");
    const sentences = rawLines.filter(line => line.length > 0); // DO NOT trim each line
    return sentences;
  }

  function computeDatasetId(sentences) {
    const material = "v1\n" + sentences.join("\n");
    return hex8(hash32_FNV1a_UTF8(material));
  }

  // ===== Random seed code (Crockford Base32) =====
  const CROCKFORD = "0123456789ABCDEFGHJKMNPQRSTVWXYZ"; // no I/L/O/U
  function randomSeedCode(len = 7) {
    const bytes = new Uint8Array(len);
    crypto.getRandomValues(bytes);
    let out = "";
    for (let i = 0; i < len; i++) out += CROCKFORD[bytes[i] % 32];
    return out;
  }

  // ===== LocalStorage =====
  function storageKey(datasetId) {
    return "skrivstart.v1." + datasetId;
  }

  function loadHistory(datasetId) {
    try {
      const raw = localStorage.getItem(storageKey(datasetId));
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || obj.version !== StorageSchemaVersion || obj.datasetId !== datasetId) return null;
      if (!Array.isArray(obj.runs)) obj.runs = [];
      return obj;
    } catch {
      return null;
    }
  }

  function saveHistory() {
    if (!model.datasetId) return;
    if (!model.history) return;
    try {
      localStorage.setItem(storageKey(model.datasetId), JSON.stringify(model.history));
    } catch {
      // ignore quota errors
    }
  }

  function ensureHistoryInitialized() {
    if (!model.history) {
      model.history = {
        version: StorageSchemaVersion,
        datasetId: model.datasetId,
        settingsSnapshot: {
          seedText: model.settings.seedText,
          minLen: model.settings.minLen,
          maxLen: model.settings.maxLen,
          fontSizePx: model.settings.fontSizePx,
          seedSalt: model.settings.seedSalt,
          historyLimit: model.settings.historyLimit,
        },
        sessionSnapshot: {
          seedText: model.settings.seedText,
          seriesIndex: model.session?.seriesIndex ?? 0,
        },
        runs: [],
      };
    }
  }

  function persistSnapshots() {
    ensureHistoryInitialized();
    model.history.settingsSnapshot = {
      seedText: model.settings.seedText,
      minLen: model.settings.minLen,
      maxLen: model.settings.maxLen,
      fontSizePx: model.settings.fontSizePx,
      seedSalt: model.settings.seedSalt,
      historyLimit: model.settings.historyLimit,
    };
    model.history.sessionSnapshot = {
      seedText: model.settings.seedText,
      seriesIndex: model.session?.seriesIndex ?? 0,
    };
    // retention
    const limit = clampInt(model.settings.historyLimit, 0);
    if (limit > 0 && model.history.runs.length > limit) {
      model.history.runs = model.history.runs.slice(model.history.runs.length - limit);
    }
    saveHistory();
  }

  // ===== Validation & session init =====
  function validateAndNormalizeSettings() {
    model.ui.warnings = [];

    // enforce minLen <= maxLen via swap/clamp
    let minLen = clampInt(model.settings.minLen, 0);
    let maxLen = clampInt(model.settings.maxLen, 0);
    if (minLen > maxLen) {
      const t = minLen; minLen = maxLen; maxLen = t;
    }
    model.settings.minLen = minLen;
    model.settings.maxLen = maxLen;

    model.settings.fontSizePx = clampInt(model.settings.fontSizePx, 12);
    model.settings.seedSalt = clampInt(model.settings.seedSalt, 0);
    model.settings.historyLimit = clampInt(model.settings.historyLimit, 0);

    const seedNorm = model.settings.seedText.trim();
    model.ui.seedNorm = seedNorm;
    let seedOk = seedNorm.length >= 4;
    if (!seedOk) model.ui.warnings.push("Koden måste vara minst 4 tecken (efter trim).");

    const candidates = computeCandidates(model.sentences, model.settings.minLen, model.settings.maxLen);
    model.ui.candidateCount = candidates.length;
    if (candidates.length === 0) model.ui.warnings.push("Inga meningar matchar filtret.");

    model.ui.canStart = seedOk && (candidates.length > 0);

    // session (deterministic settings only)
    const seriesIndex = (model.session?.seriesIndex ?? 0);
    const seedBase = model.datasetId ? computeSeedBase(model.datasetId, minLen, maxLen, model.settings.seedSalt, seedNorm) : 0;
    model.session = {
      seedText: model.settings.seedText,
      seedNorm,
      seedBase,
      seriesIndex: clampInt(seriesIndex, 0),
    };

    persistSnapshots();
  }

  // ===== UI building (settings controls built once) =====
  function buildSettingsControlsOnce() {
    if (controls.size > 0) return;

    // Create a container card that we will reuse for config state rendering (but controls stay stable)
    // Controls are stored and later inserted into config layout.
    for (const meta of settingsMeta) {
      if (!meta.ui) continue;

      const input = document.createElement("input");
      input.type = meta.type;
      input.id = "set_" + meta.id;
      if (meta.type === "number") {
        if (meta.min !== undefined) input.min = String(meta.min);
        if (meta.step !== undefined) input.step = String(meta.step);
      }
      input.autocomplete = "off";

      input.addEventListener("input", () => {
        if (model.state !== "config") return; // locked elsewhere
        if (meta.type === "number") {
          model.settings[meta.id] = Number(input.value);
        } else {
          model.settings[meta.id] = input.value;
        }
        validateAndNormalizeSettings();
        syncSettingsControlsFromModel();
        render(); // state-driven
      });

      controls.set(meta.id, input);
    }
  }

  function syncSettingsControlsFromModel() {
    for (const meta of settingsMeta) {
      if (!meta.ui) continue;
      const input = controls.get(meta.id);
      if (!input) continue;

      const v = model.settings[meta.id];
      const str = (meta.type === "number") ? String(v) : String(v ?? "");
      if (input.value !== str) input.value = str;

      // disable controls outside config (locked)
      input.disabled = (model.state !== "config");
    }
  }

  // ===== Gameplay helpers =====
  function longestCommonPrefixLen(a, b) {
    const n = Math.min(a.length, b.length);
    let i = 0;
    for (; i < n; i++) if (a.charCodeAt(i) !== b.charCodeAt(i)) break;
    return i;
  }

  function renderTargetColored(target, typed) {
    const k = longestCommonPrefixLen(target, typed);
    const good = visualizeSpaces(target.slice(0, k));
    const rest = visualizeSpaces(target.slice(k));
    return `<span class="good">${escapeHtml(good)}</span><span class="remain">${escapeHtml(rest)}</span>`;
  }

  function renderOverlayColored(target, typed) {
    const k = longestCommonPrefixLen(target, typed);
    const good = visualizeSpaces(typed.slice(0, k));
    const rest = visualizeSpaces(typed.slice(k));
    return `<span class="good">${escapeHtml(good)}</span><span class="rest">${escapeHtml(rest)}</span>`;
  }

  function preventPasteDrop(textarea) {
    textarea.addEventListener("paste", (e) => e.preventDefault());
    textarea.addEventListener("drop", (e) => e.preventDefault());
  }

  // ===== State transitions =====
  function goError(message) {
    model.state = "error";
    model.error = message || "Ett fel inträffade.";
    render();
  }

  function goConfig() {
    model.state = "config";
    model.run = null;
    // Remove result Enter handler if present
    if (resultKeyHandler) {
      document.removeEventListener("keydown", resultKeyHandler, true);
      resultKeyHandler = null;
    }
    render();
  }

  function startRound() {
    validateAndNormalizeSettings();
    if (!model.ui.canStart) return;

    const seriesIndex = model.session.seriesIndex; // do not mutate on Start
    const sel = selectTarget(model.sentences, model.datasetId, model.settings, seriesIndex);
    if (!sel.target) return;

    model.run = {
      id: crypto.randomUUID ? crypto.randomUUID() : ("run_" + Date.now() + "_" + Math.random().toString(16).slice(2)),
      playedAtMs: Date.now(),
      startAtMs: Date.now(),
      endAtMs: null,

      seriesIndex,
      seedText: sel.seedNorm, // store seedNorm consistently
      seedSalt: model.settings.seedSalt,

      minLen: model.settings.minLen,
      maxLen: model.settings.maxLen,
      fontSizePx: model.settings.fontSizePx,

      target: sel.target,
      typed: "",
      prevTyped: "",
      mistakes: 0,
      status: null, // "ok" | "timeout"
      durationMs: null,
      cpm: null,
    };

    model.state = "playing";
    render();

    // focus textarea on entering playing
    if (textareaEl) textareaEl.focus();

    // start a timer tick to enforce timeout
    scheduleTick();
  }

  let tickTimer = null;
  function scheduleTick() {
    if (tickTimer) clearTimeout(tickTimer);
    if (model.state !== "playing" || !model.run) return;

    const now = Date.now();
    const elapsed = now - model.run.startAtMs;
    if (elapsed >= maxDurationMs) {
      endRun("timeout");
      return;
    }

    // coarse ticking
    tickTimer = setTimeout(scheduleTick, 50);
  }

  function cancelPlaying() {
    if (model.state !== "playing") return;
    if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }

    // On “Avbryt”: return to config; do NOT record run; do NOT change seriesIndex.
    model.run = null;
    goConfig();
  }

  function endRun(status) {
    if (!model.run) return;
    if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }

    const endMs = Date.now();
    model.run.endAtMs = endMs;
    model.run.status = status;

    const durationMs = Math.max(0, endMs - model.run.startAtMs);
    model.run.durationMs = durationMs;

    const minutes = durationMs / 60000;
    const chars = model.run.target.length;
    const cpm = minutes > 0 ? (chars / minutes) : (chars * 60000); // defensive
    model.run.cpm = cpm;

    // After a completed run (ok OR timeout): seriesIndex++
    model.session.seriesIndex = (model.session.seriesIndex >>> 0) + 1;
    model.session.seriesIndex = clampInt(model.session.seriesIndex, 0);

    // record run to history
    ensureHistoryInitialized();
    model.history.runs.push({
      id: model.run.id,
      playedAtMs: model.run.playedAtMs,
      startAtMs: model.run.startAtMs,

      seriesIndex: model.run.seriesIndex,
      seedText: model.run.seedText,
      seedSalt: model.run.seedSalt,

      minLen: model.run.minLen,
      maxLen: model.run.maxLen,
      fontSizePx: model.run.fontSizePx,

      target: model.run.target,
      durationMs: model.run.durationMs,
      cpm: model.run.cpm,
      mistakes: model.run.mistakes,
      status: model.run.status,
    });

    persistSnapshots();

    model.state = "result";
    render();

    // Focus "Nästa" on result
    if (nextBtnEl) nextBtnEl.focus();

    // Enter triggers "Nästa" regardless of focus
    if (resultKeyHandler) {
      document.removeEventListener("keydown", resultKeyHandler, true);
      resultKeyHandler = null;
    }
    resultKeyHandler = (e) => {
      if (model.state !== "result") return;
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        const btn = document.getElementById("btn_next");
        if (btn && !btn.disabled) btn.click();
      }
    };
    document.addEventListener("keydown", resultKeyHandler, true);
  }

  function nextRoundFromResult() {
    // "Nästa" starts next round immediately; seriesIndex already incremented
    startRound();
  }

  // ===== Config actions =====
  function resetSeries() {
    model.session.seriesIndex = 0;
    persistSnapshots();
    render();
  }

  function newRandomCode() {
    model.settings.seedText = randomSeedCode(7);
    model.session.seriesIndex = 0;
    validateAndNormalizeSettings();
    syncSettingsControlsFromModel();
    render();
  }

  // ===== History computations =====
  function computeHistorySummary(runs) {
    const total = runs.length;
    const cpms = runs.map(r => r.cpm).filter(n => Number.isFinite(n));
    const best = cpms.length ? Math.max(...cpms) : null;

    const last10 = runs.slice(-10).map(r => r.cpm).filter(n => Number.isFinite(n)).sort((a,b)=>a-b);
    let median10 = null;
    if (last10.length) {
      const mid = Math.floor(last10.length / 2);
      median10 = (last10.length % 2) ? last10[mid] : (last10[mid-1] + last10[mid]) / 2;
    }
    return { total, best, median10 };
  }

  function drawCpmChart(canvas, runs) {
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;

    ctx.clearRect(0,0,w,h);

    const N = 100;
    const windowRuns = runs.slice(Math.max(0, runs.length - N));
    const vals = windowRuns.map(r => (Number.isFinite(r.cpm) ? r.cpm : 0));
    if (vals.length === 0) {
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = "#eee";
      ctx.font = `${Math.floor(12*dpr)}px system-ui`;
      ctx.fillText("Ingen data ännu.", Math.floor(14*dpr), Math.floor(24*dpr));
      ctx.globalAlpha = 1;
      return;
    }

    const maxValRaw = Math.max(...vals);
    const yMax = Math.min(maxValRaw, CPM_CAP);
    const yMin = 0;

    const pad = 14 * dpr;
    const plotW = w - pad*2;
    const plotH = h - pad*2;

    // axes
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = "#eee";
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath();
    ctx.moveTo(pad, pad);
    ctx.lineTo(pad, h-pad);
    ctx.lineTo(w-pad, h-pad);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // polyline
    ctx.strokeStyle = "#eee";
    ctx.lineWidth = 2 * dpr;
    ctx.beginPath();
    for (let i = 0; i < vals.length; i++) {
      const x = pad + (vals.length === 1 ? 0 : (i/(vals.length-1))*plotW);
      const capped = Math.min(vals[i], yMax);
      const t = (capped - yMin) / (Math.max(1e-9, (yMax - yMin)));
      const y = pad + (1 - t)*plotH;
      if (i === 0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();

    // label yMax
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = "#eee";
    ctx.font = `${Math.floor(12*dpr)}px system-ui`;
    ctx.fillText(`CPM (senaste ${vals.length}, yMax=${Math.round(yMax)})`, pad, Math.floor(pad - 4*dpr));
    ctx.globalAlpha = 1;
  }

  // ===== Rendering =====
  function render() {
    syncSettingsControlsFromModel();

    // clear & rebuild per state (state-driven, no hidden DOM truth)
    appEl.innerHTML = "";

    // Header / meta
    const topCard = document.createElement("div");
    topCard.className = "card";
    topCard.innerHTML = `
      <div class="row" style="justify-content:space-between;">
        <div class="col" style="gap:2px;">
          <div style="font-size:22px;font-weight:900;">Skrivstart</div>
          <div class="help">SpecVersion: <span class="mono">${escapeHtml(SpecVersion)}</span> · Dataset: <span class="mono">${escapeHtml(model.datasetId || "…")}</span></div>
        </div>
        <div class="help">Läge: deterministiskt serie-läge</div>
      </div>
    `;
    appEl.appendChild(topCard);

    if (model.state === "loading") {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `
        <div class="help">Laddar <span class="mono">sentences.txt</span>…</div>
        <div class="spinner" aria-label="Laddar"></div>
      `;
      appEl.appendChild(c);
      return;
    }

    if (model.state === "error") {
      const c = document.createElement("div");
      c.className = "card errorBox";
      c.innerHTML = `
        <div style="font-weight:900;margin-bottom:6px;">Fel</div>
        <div>${escapeHtml(model.error || "Kunde inte ladda dataset.")}</div>
        <div style="margin-top:12px;">
          <button id="btn_reload">Försök igen</button>
        </div>
      `;
      appEl.appendChild(c);
      c.querySelector("#btn_reload").addEventListener("click", () => location.reload());
      return;
    }

    // Main state card
    if (model.state === "config") {
      validateAndNormalizeSettings();

      const c = document.createElement("div");
      c.className = "card";

      // Build settings UI using existing controls
      const seedInput = controls.get("seedText");
      const minLenInput = controls.get("minLen");
      const maxLenInput = controls.get("maxLen");
      const fontSizeInput = controls.get("fontSizePx");

      // Update placeholders/hints
      if (seedInput) seedInput.placeholder = "t.ex. 7H2K9QM";

      const seriesIndex = model.session?.seriesIndex ?? 0;
      const warningsHtml = model.ui.warnings.map(w => `<div class="warn">• ${escapeHtml(w)}</div>`).join("");

      c.innerHTML = `
        <div class="row" style="justify-content:space-between;align-items:flex-start;">
          <div class="col">
            <div class="help">Serieposition: <span class="mono">${seriesIndex}</span>
              <span class="pill">kandidater: <span class="mono">${model.ui.candidateCount}</span></span>
            </div>
          </div>
          <div class="row">
            <button id="btn_start" ${model.ui.canStart ? "" : "disabled"}>Start</button>
            <button id="btn_reset">Nollställ serie</button>
            <button id="btn_newcode">Ny slumpad kod</button>
          </div>
        </div>

        <div style="height:10px"></div>

        <div class="row" style="gap:16px;">
          <div class="col">
            <label for="set_seedText">Kod</label>
            <div id="slot_seed"></div>
            <div class="help">Dela koden med andra för samma mening/serie.</div>
          </div>

          <div class="col">
            <label for="set_minLen">Min längd</label>
            <div id="slot_min"></div>
          </div>

          <div class="col">
            <label for="set_maxLen">Max längd</label>
            <div id="slot_max"></div>
          </div>

          <div class="col">
            <label for="set_fontSizePx">Textstorlek (px)</label>
            <div id="slot_font"></div>
          </div>
        </div>

        <div style="margin-top:10px;">
          ${warningsHtml ? `<div>${warningsHtml}</div>` : `<div class="ok">Redo.</div>`}
        </div>
      `;

      appEl.appendChild(c);

      // Insert existing inputs into slots (controls built once)
      c.querySelector("#slot_seed").appendChild(seedInput);
      c.querySelector("#slot_min").appendChild(minLenInput);
      c.querySelector("#slot_max").appendChild(maxLenInput);
      c.querySelector("#slot_font").appendChild(fontSizeInput);

      c.querySelector("#btn_start").addEventListener("click", startRound);
      c.querySelector("#btn_reset").addEventListener("click", resetSeries);
      c.querySelector("#btn_newcode").addEventListener("click", newRandomCode);

      // History below
      appEl.appendChild(renderHistoryCard());
      return;
    }

    if (model.state === "playing" || model.state === "result") {
      // Lock settings controls
      syncSettingsControlsFromModel();

      const run = model.run;
      if (!run) { goConfig(); return; }

      const fontSize = clampInt(run.fontSizePx, 12);

      // Main gameplay card
      const c = document.createElement("div");
      c.className = "card";

      const typed = run.typed || "";
      const target = run.target;

      const targetHtml = renderTargetColored(target, typed);
      const overlayHtml = renderOverlayColored(target, typed);

      const elapsed = Date.now() - run.startAtMs;
      const elapsedClamped = Math.min(elapsed, maxDurationMs);

      c.innerHTML = `
        <div class="row" style="justify-content:space-between;align-items:center;">
          <div class="help">
            Serieindex: <span class="mono">${run.seriesIndex}</span>
            <span class="pill">seed: <span class="mono">${escapeHtml(String(run.seedText).slice(0,6))}</span></span>
            <span class="pill">len: <span class="mono">${target.length}</span></span>
          </div>
          ${model.state === "playing" ? `<button class="small" id="btn_cancel">Avbryt</button>` : `<div></div>`}
        </div>

        <div style="height:10px"></div>

        <div class="centerText target" id="targetDisplay" style="font-size:${fontSize}px;">
          ${targetHtml}
        </div>

        <div style="height:14px"></div>

        <div class="inputWrap">
          <div class="inputBox">
            <div class="overlay" id="overlay" aria-hidden="true" style="font-size:${fontSize}px;">${overlayHtml}</div>
            <textarea id="typing"
              autocomplete="off" autocapitalize="off" spellcheck="false"
              ${model.state === "result" ? "disabled" : ""}
              aria-label="Skriv meningen här"
              style="font-size:${fontSize}px;"></textarea>
          </div>
        </div>

        <div style="height:12px"></div>

        <div class="row" style="justify-content:space-between;">
          <div class="help">Tid: <span class="mono" id="liveTime">${formatDurationMs(elapsedClamped)}</span></div>
          <div class="help">Mistakes: <span class="mono" id="liveMistakes">${run.mistakes}</span></div>
        </div>
      `;

      appEl.appendChild(c);

      textareaEl = c.querySelector("#typing");
      overlayEl = c.querySelector("#overlay");

      // init textarea content (kept in model)
      textareaEl.value = typed;

      // Prevent paste & drop
      preventPasteDrop(textareaEl);

      // Sync scroll from textarea to overlay
      const syncScroll = () => {
        if (!overlayEl || !textareaEl) return;
        overlayEl.scrollTop = textareaEl.scrollTop;
        overlayEl.scrollLeft = textareaEl.scrollLeft;
      };
      textareaEl.addEventListener("scroll", syncScroll);

      // Input handling (mistakes + completion)
      if (model.state === "playing") {
        textareaEl.addEventListener("input", () => {
          const newTyped = textareaEl.value;

          // Mistake counting (spec)
          if (newTyped.length !== run.prevTyped.length && !run.target.startsWith(newTyped)) {
            run.mistakes++;
          }
          run.prevTyped = newTyped;
          run.typed = newTyped;

          // Update visuals
          const tHtml = renderTargetColored(run.target, run.typed);
          const oHtml = renderOverlayColored(run.target, run.typed);
          c.querySelector("#targetDisplay").innerHTML = tHtml;
          overlayEl.innerHTML = oHtml;
          c.querySelector("#liveMistakes").textContent = String(run.mistakes);

          // Completion check
          if (run.typed === run.target) {
            endRun("ok");
            return;
          }

          // Keep time display fresh-ish
          c.querySelector("#liveTime").textContent = formatDurationMs(Math.min(Date.now() - run.startAtMs, maxDurationMs));
        });

        // Cancel button
        c.querySelector("#btn_cancel").addEventListener("click", cancelPlaying);

        // Focus textarea
        textareaEl.focus();

        // Light timer updates while playing
        const timeTicker = () => {
          if (model.state !== "playing" || !model.run) return;
          const now = Date.now();
          const el = c.querySelector("#liveTime");
          if (el) el.textContent = formatDurationMs(Math.min(now - run.startAtMs, maxDurationMs));
          requestAnimationFrame(timeTicker);
        };
        requestAnimationFrame(timeTicker);
      } else {
        // result state: show frozen target/input; focus will be set on "Nästa" in result card below
        syncScroll();
      }

      // Result card (under current result stats, with two buttons always)
      if (model.state === "result") {
        const r = document.createElement("div");
        r.className = "card";
        const statusLabel = run.status === "timeout" ? "Timeout" : "OK";
        const cpmRounded = Math.round(run.cpm);

        // Stats list (extensible)
        const statDefs = [
          { id:"time", label:"Tid", compute: rr => rr.durationMs, format: v => formatDurationMs(v) },
          { id:"cpm", label:"CPM", compute: rr => rr.cpm, format: v => String(Math.round(v)) },
          { id:"mistakes", label:"Mistakes", compute: rr => rr.mistakes, format: v => String(v) },
          { id:"status", label:"Status", compute: rr => rr.status, format: v => (v === "timeout" ? "Timeout" : "OK") },
        ];

        r.innerHTML = `
          <div class="row" style="justify-content:space-between;align-items:center;">
            <div style="font-weight:900;font-size:18px;">Resultat</div>
            <div class="help">Serieposition går vidare till <span class="mono">${model.session.seriesIndex}</span></div>
          </div>

          <div style="height:10px"></div>

          <div class="statsGrid">
            ${statDefs.map(sd => `
              <div class="stat">
                <div class="k">${escapeHtml(sd.label)}</div>
                <div class="v mono">${escapeHtml(sd.format(sd.compute(run)))}</div>
              </div>
            `).join("")}
          </div>

          <div style="height:12px"></div>

          <div class="row" style="justify-content:flex-start;">
            <button id="btn_next">Nästa</button>
            <button id="btn_ok">Okej</button>
          </div>
        `;
        appEl.appendChild(r);

        nextBtnEl = r.querySelector("#btn_next");
        nextBtnEl.id = "btn_next"; // ensure stable id
        nextBtnEl.addEventListener("click", nextRoundFromResult);
        r.querySelector("#btn_ok").addEventListener("click", goConfig);

        // Focus "Nästa"
        nextBtnEl.focus();
      }

      // History below
      appEl.appendChild(renderHistoryCard());
      return;
    }
  }

  function renderHistoryCard() {
    const c = document.createElement("div");
    c.className = "card";
    const runs = (model.history?.runs ?? []).slice(); // chronological

    const sum = computeHistorySummary(runs);
    const bestStr = (sum.best == null) ? "—" : String(Math.round(sum.best));
    const medStr = (sum.median10 == null) ? "—" : String(Math.round(sum.median10));

    c.innerHTML = `
      <div class="historyTitle">Historik</div>
      <div class="historySummary">
        <div>Total runs: <span class="mono">${sum.total}</span></div>
        <div>Best CPM: <span class="mono">${bestStr}</span></div>
        <div>Median senaste 10: <span class="mono">${medStr}</span></div>
      </div>
      <canvas id="histCanvas" aria-label="CPM över tid"></canvas>

      <table aria-label="Senaste rundor">
        <thead>
          <tr>
            <th>Datum/tid</th>
            <th>Duration</th>
            <th>CPM</th>
            <th>Mistakes</th>
            <th>Len</th>
            <th>Status</th>
            <th>Serie</th>
            <th>Seed</th>
          </tr>
        </thead>
        <tbody id="histBody">
          ${renderHistoryRows(runs)}
        </tbody>
      </table>
    `;

    const canvas = c.querySelector("#histCanvas");
    drawCpmChart(canvas, runs);

    // Redraw on resize (simple)
    let ro = new ResizeObserver(() => drawCpmChart(canvas, runs));
    ro.observe(canvas);

    return c;
  }

  function renderHistoryRows(runsChrono) {
    // Descending list/table of recent runs
    const runs = runsChrono.slice().reverse();
    const fmtDate = (ms) => {
      const d = new Date(ms);
      // Use user's locale; deterministic not required for display
      return d.toLocaleString(undefined, { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    };

    const rows = runs.map(r => {
      const dt = fmtDate(r.playedAtMs);
      const dur = formatDurationMs(r.durationMs);
      const cpm = String(Math.round(r.cpm));
      const status = (r.status === "timeout") ? "Timeout" : "OK";
      const seedShort = String(r.seedText ?? "").slice(0,6);
      const tooltip = visualizeSpaces(String(r.target ?? "")); // tooltip shows spaces as ·
      // Tooltip requirement: hover/focus reachable. Use title + aria-label via focusable cell content.
      // We make first cell contain a focusable span carrying title + aria-label.
      return `
        <tr>
          <td>
            <span tabindex="0"
              class="mono"
              title="${escapeHtml(tooltip)}"
              aria-label="Målmening: ${escapeHtml(tooltip)}">
              ${escapeHtml(dt)}
            </span>
          </td>
          <td class="mono">${escapeHtml(dur)}</td>
          <td class="mono">${escapeHtml(cpm)}</td>
          <td class="mono">${escapeHtml(String(r.mistakes))}</td>
          <td class="mono">${escapeHtml(String((r.target ?? "").length))}</td>
          <td class="mono">${escapeHtml(status)}</td>
          <td class="mono">${escapeHtml(String(r.seriesIndex))}</td>
          <td class="mono">${escapeHtml(seedShort)}</td>
        </tr>
      `;
    }).join("");
    return rows || `<tr><td colspan="8" class="help">Inga rundor än.</td></tr>`;
  }

  // ===== Boot =====
  async function boot() {
    try {
      model.state = "loading";
      render();

      // 1) fetch sentences.txt
      const res = await fetch("./sentences.txt", { cache: "no-store" });
      if (!res.ok) throw new Error("Kunde inte hämta sentences.txt (HTTP " + res.status + ").");
      let text = await res.text();

      // 2) parse exact
      const sentences = parseSentencesExact(text);
      if (!sentences.length) throw new Error("sentences.txt innehåller inga meningar (efter tomradsfilter).");
      model.sentences = sentences;

      // 3) datasetId exact
      model.datasetId = computeDatasetId(sentences);

      // 4) load history keyed per datasetId
      model.history = loadHistory(model.datasetId);

      // 5) restore settings + session snapshot
      if (model.history?.settingsSnapshot) {
        const s = model.history.settingsSnapshot;
        // restore all stored fields
        for (const k of ["seedText","minLen","maxLen","fontSizePx","seedSalt","historyLimit"]) {
          if (k in s) model.settings[k] = s[k];
        }
      }
      if (model.history?.sessionSnapshot) {
        const ss = model.history.sessionSnapshot;
        if (typeof ss.seedText === "string") model.settings.seedText = ss.seedText;
        model.session = { seedText: model.settings.seedText, seedNorm: model.settings.seedText.trim(), seedBase: 0, seriesIndex: clampInt(ss.seriesIndex ?? 0, 0) };
      }

      // 6) default seed if none
      if (!model.settings.seedText || model.settings.seedText.trim().length === 0) {
        model.settings.seedText = randomSeedCode(7);
      }

      // Build settings UI controls once
      buildSettingsControlsOnce();

      // init session from settings
      validateAndNormalizeSettings();
      syncSettingsControlsFromModel();

      model.state = "config";
      render();
    } catch (e) {
      goError(String(e && e.message ? e.message : e));
    }
  }

  boot();
})();
</script>
